    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const img = new Image();
            img.src = 'logo.png';
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(0, 0, 64, 64, 14);
                ctx.fill();

                const scale = Math.min(52 / img.width, 52 / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                ctx.drawImage(img, (64 - w) / 2, (64 - h) / 2, w, h);

                const link = document.querySelector("link[rel~='icon']");
                if (link) link.href = canvas.toDataURL('image/png');
            };
        });
    </script>

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2200);
        }

        window.copyText = (text, label = 'Dato') => {
            if (!text || text === '-') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} copiado: ${text}`);
            });
        };

                       </button>`
                    : `<span class="text-slate-300 text-xs">-</span>`;

                const correoHtml = (person.correo && person.correo !== '-')
                    ? `<div class="flex items-center gap-1.5">
                        <a href="mailto:${person.correo.split(' / ')[0]}" class="text-xs font-medium text-[#00553d] hover:underline truncate max-w-[230px]">${person.correo}</a>
                        <button onclick="window.copyText('${person.correo}', 'Correo')" title="Copiar correo" class="text-slate-400 hover:text-slate-700 p-0.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        </button>
                       </div>`
                    : '';

                const movilHtml = (person.movil && person.movil !== '-')
                    ? `<button onclick="window.copyText('${person.movil}', 'Teléfono')" title="Clic para copiar teléfono"
                        class="text-xs font-mono text-slate-600 hover:text-[#00553d] hover:underline block mt-0.5 cursor-pointer">
                        Tel: ${person.movil}
                       </button>`
                    : '';

                const ubicacionBadge = activeCampus === "Central"
                    ? `<span class="inline-block text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200/80 px-2.5 py-1 rounded-md">${person.ubicacion || '-'}</span>`
                    : `<span class="inline-block text-xs font-medium ${activeCampus === 'Zona 3' ? 'bg-blue-50 text-blue-700 border-blue-200/70' : 'bg-rose-50 text-rose-700 border-rose-200/70'} border px-2.5 py-1 rounded-md">${person.ubicacion}</span>`;

                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-800">
                        ${person.nombre}
                        ${person.inactivo ? '<span class="ml-1.5 text-[10px] uppercase font-bold bg-red-100 text-red-700 px-1.5 py-0.5 rounded">Inactivo</span>' : ''}
                    </td>
                    <td class="py-3 px-4 text-slate-600">${person.puesto}</td>
                    <td class="py-3 px-4 whitespace-nowrap">${ubicacionBadge}</td>
                    <td class="py-3 px-4 whitespace-nowrap">${extHtml}</td>
                    <td class="py-3 px-4">${correoHtml || movilHtml ? `${correoHtml}${movilHtml}` : '<span class="text-slate-300 text-xs">-</span>'}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function filterDirectory() {
            const rawSearch = searchInput.value;
            clearSearchBtn.classList.toggle('hidden', !rawSearch);

            const term = normalizeText(rawSearch.trim());
            const selectedLevel = levelFilter.value;
            const currentList = datasets[activeCampus] || [];

            const filtered = currentList.filter(person => {
                const searchable = normalizeText(`${person.nombre} ${person.puesto} ${person.ubicacion} ${person.correo || ''} ${person.extension || ''} ${person.movil || ''}`);
                const matchesSearch = searchable.includes(term);
                const matchesLevel = activeCampus !== "Central" || selectedLevel === 'Todos' || person.nivel === selectedLevel;
                return matchesSearch && matchesLevel;
            });

            renderTable(filtered);
        }

        document.querySelectorAll('.campus-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.campus-tab').forEach(t => {
                    t.classList.remove('bg-[#00553d]', 'text-white', 'shadow-sm');
                    t.classList.add('text-slate-600', 'hover:bg-slate-100');
                });
                tab.classList.add('bg-[#00553d]', 'text-white', 'shadow-sm');
                tab.classList.remove('text-slate-600', 'hover:bg-slate-100');

                activeCampus = tab.getAttribute('data-campus');
                updateHeaderInfo();
                filterDirectory();
            });
        });

        searchInput.addEventListener('input', filterDirectory);
        levelFilter.addEventListener('change', filterDirectory);

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
            filterDirectory();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        updateHeaderInfo();
        filterDirectory();
    </script>
</body>
</html>
